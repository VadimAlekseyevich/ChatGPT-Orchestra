name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  contracts:
    name: Contracts / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:contracts

  persistence:
    name: Persistence + SQLite / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:phase11

  desktop:
    name: Desktop shell / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:phase15

  companion:
    name: Companion bridge / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:phase16

  local-git:
    name: Local Git worktrees / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: git --version
      - run: npm run test:phase17

  direct-browser:
    name: Direct browser runtime / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:phase18

  desktop-parity:
    name: Desktop parity + chaos / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:phase19

  desktop-alpha:
    name: Desktop alpha acceptance / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: git --version
      - run: npm run test:phase20
      - run: node scripts/validate-alpha-readiness.js

  browser-fixtures:
    name: Extension browser fixtures / Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - run: npm run test:browser-fixtures

  release-contract:
    name: Manifest + release contract / Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - run: npm run test:release

  alpha-package:
    name: Alpha candidate installer / Windows Node 22
    runs-on: windows-latest
    needs: [desktop-alpha]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund
      - name: Run alpha readiness gate
        run: npm run test:alpha
      - name: Build Windows alpha installer
        run: npm run desktop:dist:win
      - name: Stage fallback extension
        run: npm run extension:stage-alpha
      - name: Verify alpha artifact layout and signatures
        shell: pwsh
        run: |
          $desktop = "dist/desktop/win-unpacked/ChatGPT Orchestra.exe"
          $extension = "dist/alpha-extension/manifest.json"
          $installer = Get-ChildItem "dist/desktop" -Filter "*.exe" -File | Where-Object { $_.FullName -ne (Resolve-Path $desktop -ErrorAction SilentlyContinue) } | Select-Object -First 1
          if (!(Test-Path $desktop -PathType Leaf)) { throw "missing_alpha_desktop_executable:$desktop" }
          if (!(Test-Path $extension -PathType Leaf)) { throw "missing_alpha_extension_manifest:$extension" }
          if (!$installer) { throw "missing_alpha_windows_installer" }
          $manifest = Get-Content $extension -Raw | ConvertFrom-Json
          if ($manifest.version_name -ne "2.0.0-alpha.20") { throw "alpha_extension_version_mismatch" }
          foreach ($signedFile in @((Resolve-Path $desktop).Path, $installer.FullName)) {
            $signature = Get-AuthenticodeSignature $signedFile
            Write-Host "Authenticode $signedFile => $($signature.Status); signer=$($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid" -or !$signature.SignerCertificate) { throw "alpha_windows_signature_invalid:${signedFile}:$($signature.Status)" }
          }
          Write-Host "alpha installer: $($installer.FullName)"
      - name: Upload Windows alpha candidate
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-orchestra-alpha20-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/desktop/*.exe
            dist/desktop/win-unpacked
            dist/alpha-extension

  phase14:
    name: Aggregate release gate / Node 22
    runs-on: ubuntu-latest
    needs: [core, contracts, persistence, browser-fixtures, release-contract, desktop, companion, local-git, direct-browser, desktop-parity, desktop-alpha, alpha-package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:phase14
