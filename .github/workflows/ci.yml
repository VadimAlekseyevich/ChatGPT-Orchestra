name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  contracts:
    name: Contracts / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:contracts

  persistence:
    name: Persistence + SQLite / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:phase11

  desktop:
    name: Desktop shell / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:phase15

  companion:
    name: Companion bridge / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:phase16

  browser-fixtures:
    name: Extension browser fixtures / Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - run: npm run test:browser-fixtures

  release-contract:
    name: Manifest + release contract / Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - run: npm run test:release

  alpha-package:
    name: Alpha package / Windows Node 22
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund
      - name: Run alpha readiness gate
        run: npm run test:alpha
      - name: Build unpacked Windows desktop
        run: npm run desktop:pack
      - name: Stage unpacked extension
        run: npm run extension:stage-alpha
      - name: Verify alpha artifact layout
        shell: pwsh
        run: |
          $desktop = "dist/desktop/win-unpacked/ChatGPT Orchestra.exe"
          $extension = "dist/alpha-extension/manifest.json"
          if (!(Test-Path $desktop -PathType Leaf)) { throw "missing_alpha_desktop_executable:$desktop" }
          if (!(Test-Path $extension -PathType Leaf)) { throw "missing_alpha_extension_manifest:$extension" }
          $manifest = Get-Content $extension -Raw | ConvertFrom-Json
          if ($manifest.version_name -ne "2.0.0-alpha.16") { throw "alpha_extension_version_mismatch" }
      - name: Upload Windows alpha bundle
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-orchestra-alpha16-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/desktop/win-unpacked
            dist/alpha-extension

  phase14:
    name: Phase 14 aggregate / Node 22
    runs-on: ubuntu-latest
    needs: [core, contracts, persistence, browser-fixtures, release-contract, desktop, companion, alpha-package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:phase14
