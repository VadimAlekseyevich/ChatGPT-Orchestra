<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
  <title>ChatGPT Orchestra Desktop</title>
  <link rel="stylesheet" href="../../../popup.css" />
</head>
<body class="dashboard-standalone-body">
  <main class="panel dashboard-standalone-panel">
    <header class="desktop-header">
      <div>
        <h1 data-i18n="app.title">ChatGPT Orchestra · Desktop</h1>
        <p data-i18n="app.subtitle">Orchestrate coding work through Lead, Workers, Review and Integration.</p>
      </div>
      <label class="desktop-language-control">
        <span data-i18n="language.label">Language</span>
        <select id="desktopLocaleSelect">
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </label>
    </header>
    <div id="desktopWorkflowGuide"></div>
    <div id="managedBrowserOnboarding"></div>
    <div id="desktopProjectOnboarding"></div>
    <div id="desktopProjectBundleImport"></div>
    <div id="orchestraDashboard"></div>
  </main>
  <script src="../../../dashboard/dashboard-app.js"></script>
  <script src="desktop-transport.js"></script>
  <script src="i18n.js"></script>
  <script src="managed-browser-onboarding.js"></script>
  <script src="desktop-project-onboarding.js"></script>
  <script src="desktop-project-bundle-import.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
